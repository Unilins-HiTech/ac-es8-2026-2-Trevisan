<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Pokédex Simplificada T</title>

		<!-- Bootstrap 5 CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>

		<style>
			.pokemon-card {
				cursor: pointer;
				transition: transform 0.2s ease-in-out;
			}

			.pokemon-card:hover {
				transform: translateY(-5px);
			}

			.badge-type {
				text-transform: capitalize;
				margin-right: 4px;
			}

			.sprite-img {
				width: 100px;
				height: 100px;
				object-fit: contain;
			}

			.stat-name {
				text-transform: capitalize;
			}
		</style>
	</head>

	<body class="bg-light">
		<div class="container py-5">

			<header class="text-center mb-5">
				<h1 class="display-4 fw-bold text-danger">Pokédex</h1>

				<p class="lead text-secondary">
					Carregando dados da PokéAPI utilizando fetch
				</p>
			</header>

			<!-- Área de Busca -->
			<div class="row justify-content-center mb-4">
				<div class="col-md-6">
					<div class="input-group">

						<input
							type="text"
							id="searchInput"
							class="form-control"
							placeholder="Buscar por nome (ex: pikachu, charizard)..."
						/>

						<button
							class="btn btn-danger"
							type="button"
							id="searchBtn"
						>
							Buscar
						</button>

					</div>
				</div>
			</div>

			<!-- Spinner principal -->
			<div id="loading" class="text-center my-5 d-none">

				<div
					class="spinner-border text-danger"
					role="status"
					style="width: 3rem; height: 3rem"
				>
					<span class="visually-hidden">
						Carregando...
					</span>
				</div>

			</div>

			<!-- Grid dos Pokémon -->
			<div
				class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
				id="pokemonGrid"
			></div>

		</div>


		<!-- Modal com detalhes do Pokémon -->
		<div
			class="modal fade"
			id="pokemonModal"
			tabindex="-1"
			aria-labelledby="pokemonModalLabel"
			aria-hidden="true"
		>

			<div class="modal-dialog modal-lg modal-dialog-centered">

				<div class="modal-content">

					<div class="modal-header">

						<h5
							class="modal-title text-capitalize"
							id="pokemonModalLabel"
						>
							Detalhes do Pokémon
						</h5>

						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Fechar"
						></button>

					</div>

					<div
						class="modal-body"
						id="pokemonModalBody"
					>
						<!-- Conteúdo inserido pelo JavaScript -->
					</div>

				</div>

			</div>

		</div>


		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

		<!-- JavaScript da aplicação -->
		<script src="js/app.js"></script>

	</body>
</html>
