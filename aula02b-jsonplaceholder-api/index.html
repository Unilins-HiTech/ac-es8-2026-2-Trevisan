<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários e Posts — JSONPlaceholder</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Usuários (JSONPlaceholder)</h1>

    <!-- Spinner exibido enquanto a lista de usuários é carregada -->
    <div id="carregando" class="mb-3">
      <div class="d-flex align-items-center gap-2 text-muted">
        <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
        <span>Carregando usuários...</span>
      </div>
    </div>

    <!-- Campo de busca: filtra os usuários já carregados, sem nova requisição -->
    <div id="area-busca" class="mb-4">
      <input
        type="search"
        id="campo-busca"
        class="form-control"
        placeholder="Buscar usuário por nome..."
        aria-label="Buscar usuário por nome"
      >
    </div>

    <!-- Tela 1: lista de usuários -->
    <div id="tela-lista" class="row g-3"></div>

    <!-- Tela 2: detalhe de um usuário (começa escondida) -->
    <div id="tela-detalhe" class="d-none">
      <button id="btn-voltar" class="btn btn-outline-secondary mb-3">← Voltar</button>
      <h2 id="detalhe-nome" class="h4 mb-1"></h2>
      <p id="contador-posts" class="text-muted mb-3"></p>
      <ul id="lista-posts" class="list-group"></ul>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
